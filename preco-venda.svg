<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Ilustração de um bolo no pote com uma etiqueta de preço e moedas">
  <ellipse cx="240" cy="196" rx="200" ry="142" fill="#e3f1ec"/>
  <circle cx="414" cy="66" r="14" fill="#fde3d6"/>
  <circle cx="60" cy="96" r="9" fill="#d5e6fb"/>
  <ellipse cx="240" cy="326" rx="170" ry="9" fill="#c9ddd5" opacity=".7"/>

  <!-- pote -->
  <rect x="168" y="150" width="144" height="170" rx="22" fill="#ffffff" stroke="#cfe0d9" stroke-width="3"/>
  <rect x="180" y="264" width="120" height="44" rx="12" fill="#8a5a3c"/>
  <rect x="180" y="226" width="120" height="38" fill="#f9d2dc"/>
  <rect x="180" y="200" width="120" height="26" fill="#f2b98d"/>
  <rect x="180" y="174" width="120" height="26" fill="#f9d2dc"/>
