  <ellipse cx="104" cy="310" rx="34" ry="9" fill="#e2a022"/>
  <ellipse cx="104" cy="298" rx="34" ry="9" fill="#f4c04c"/>
  <rect x="70" y="286" width="68" height="12" fill="#e2a022"/>
  <ellipse cx="104" cy="286" rx="34" ry="9" fill="#f4c04c"/>
  <rect x="70" y="274" width="68" height="12" fill="#e2a022"/>
  <ellipse cx="104" cy="274" rx="34" ry="9" fill="#f9d673"/>
  <text x="104" y="277.5" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#a56d08">R$</text>
